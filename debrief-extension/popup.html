<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 300px; color: #1D1D1F;
        background: linear-gradient(115deg, #d8e4f6 0%, #dbe7f7 22%, #e7edf4 48%, #efe8e9 74%, #f4ddd8 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        font-size: 13px; -webkit-font-smoothing: antialiased;
      }
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px 11px;
        background: rgba(244,248,252,0.58);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,0.45);
        position: sticky; top: 0; z-index: 10;
      }
      .brand { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; color: #1D1D1F; }
      .icon-row { display: flex; gap: 4px; }
      .icon-btn {
        background: transparent; border: none; border-radius: 8px; cursor: pointer;
        color: #6E6E73; font-size: 14px; padding: 5px 7px; line-height: 1;
        transition: background 0.12s, color 0.12s;
      }
      .icon-btn:hover { background: rgba(0,0,0,0.06); color: #1D1D1F; }
      .icon-btn.danger:hover { background: rgba(255,59,48,0.08); color: #FF3B30; }
      .body { padding: 14px; }
      #state-logged-out { display: none; }
      .login-msg { font-size: 13px; color: #6E6E73; margin-bottom: 14px; line-height: 1.55; }
      .btn-primary {
        width: 100%; padding: 11px; background: #1D1D1F; color: #fff;
        border: none; border-radius: 12px; font-family: inherit;
        font-weight: 600; font-size: 13px; cursor: pointer;
        letter-spacing: -0.01em; box-shadow: 0 4px 14px rgba(0,0,0,0.14);
        transition: opacity 0.15s, transform 0.1s;
      }
      .btn-primary:hover { opacity: 0.88; }
      .btn-primary:active { transform: scale(0.97); }
      #state-logged-in { display: none; }
      .status-row {
        display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
        padding: 9px 12px; background: rgba(255,255,255,0.54); border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.4);
        box-shadow: 0 6px 18px rgba(109,129,160,0.08);
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
      .dot.idle      { background: #C7C7CC; }
      .dot.ready     { background: #34C759; box-shadow: 0 0 6px rgba(52,199,89,0.6); animation: pulse 1.5s ease-in-out infinite; }
      .dot.recording { background: #FF3B30; box-shadow: 0 0 6px rgba(255,59,48,0.6); animation: pulse 0.8s ease-in-out infinite; }
      .dot.error     { background: #FF3B30; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
      .status-text { font-size: 12px; color: #6E6E73; }
      .snippet {
        background: rgba(229,239,252,0.7); border: 1px solid rgba(160,187,220,0.35);
        border-radius: 10px; padding: 8px 11px; font-size: 11.5px; font-style: italic;
        max-height: 56px; overflow: hidden; word-break: break-word;
        margin-bottom: 11px; color: #007AFF; line-height: 1.5; display: none;
      }
      .snippet.visible { display: block; }
      .capture-btn {
        width: 100%; padding: 11px; background: #1D1D1F; color: #fff;
        border: none; border-radius: 12px; font-family: inherit; font-weight: 600;
        font-size: 13px; cursor: pointer; letter-spacing: -0.01em;
        box-shadow: 0 8px 20px rgba(29,29,31,0.18);
        transition: opacity 0.15s, transform 0.1s;
      }
      .capture-btn:hover { opacity: 0.88; }
      .capture-btn:active { transform: scale(0.97); }
      .capture-btn:disabled { background: rgba(0,0,0,0.06); color: #C7C7CC; box-shadow: none; cursor: not-allowed; }
      .capture-btn.stop { background: #FF3B30; box-shadow: 0 4px 14px rgba(255,59,48,0.28); }
      .footer-url { margin-top: 10px; font-size: 10.5px; color: #AEAEB2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <span class="brand">Debrief</span>
      <div class="icon-row">
        <button class="icon-btn" id="open-app-btn" title="Open Debrief App">&#x2197;</button>
        <button class="icon-btn" id="open-sidebar-btn" title="Open Sidebar">&#x25F2;</button>
        <button class="icon-btn danger" id="logout-btn" title="Log Out" style="display:none">&#x23FB;</button>
      </div>
    </div>
    <div class="body" id="state-logged-out">
      <p class="login-msg">Sign in to start capturing voice intents and enriching pages.</p>
      <button class="btn-primary" id="login-btn">Sign In</button>
    </div>
    <div class="body" id="state-logged-in">
      <div class="status-row">
        <div class="dot idle" id="dot"></div>
        <span class="status-text" id="status-text">Ready to capture.</span>
      </div>
      <div class="snippet" id="snippet"></div>
      <button class="capture-btn" id="capture-btn">Start Capture</button>
      <div class="footer-url" id="footer-url"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
