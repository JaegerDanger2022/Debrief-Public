[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debrief-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-aws>=0.2.0",
    "boto3>=1.35.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "numpy>=2.1.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["debrief_agent"]
